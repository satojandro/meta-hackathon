[project]
name = "persona-atlas"
version = "0.1.0"
description = "Persona-neuron atlas for Meta's Muse Glimmer: find and steer the MLP neurons that change a model's identity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "accelerate>=1.0",
    "numpy>=1.26",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
